<!DOCTYPE html>
<html>
<head>
    <title>JQuery Dasar</title>
    <script type="text/javascript" src="jquery copy.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Effect JQuery</h1>
    <button id="tombol1">Tampilkan kotak</button>
    <button id="tombol2">Sembunyikan kotak</button>
    <div class="box"></div>
</body>
<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol1').click(function(){
            $('.box').show();
        });
        $('#tombol2').click(function(){
            $('.box').hide();
        });
    });
</script>
</html>
