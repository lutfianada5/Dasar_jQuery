<!DOCTYPE html>
<html>
    <head>
        <title>Menetapkan nilai dan value dengan JQuery</title>
        <sript type="text/javascript" src="jquery.js"></sript>
    </head>
    <body>
        <h1>Set Function JQuery</h1>
        <button id="tombol">KLIK</button>
        <p class="nama"></p>
    </body>
    <script type="text/javascript">
        $(document).ready(function(){
            $('#tombol').click(function(){
                $('.nama').text("belajar pemograman web PPLG");
            });
        });
    </script>
</html>
