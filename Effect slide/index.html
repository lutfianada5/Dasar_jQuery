<!DOCTYPE html>
<html>
<head>
    <title>JQuery Dasar</title>
    <script type="text/javascript" src="jquery.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Efect JQuery</h1>
    <button id="tombol1">Tampilkan kotak (slideDown)</button>
    <button id="tombol2">Sembunyikan kotak (slideUp)</button>
    <button id="tombol3">Effect slide Toggle kotak (slideToggle)</button>
    <div class="box"></div>
</body>
<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol1').click(function(){
            $('.box').slideDown(); });
        $('#tombol2').click(function(){
            $('.box').slideUp(); });
        $('#tombol3').click(function(){
            $('.box').slideToggle(); });
    });
</script>
</html>
