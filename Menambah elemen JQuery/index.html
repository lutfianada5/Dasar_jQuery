<!DOCTYPE html>
<html>
    <head>
        <title>Menambah Element dengan JQuery</title>
        <script type="text/javascript" src="jquery.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <h1>Add Function JQuery</h1>
        <div class="kotak">
            <span>ISI KOTAK</span>
        </div>
        <button class="after">Tes after</button>
        <button class="before">Tes before</button>
        <button class="append">Tes append</button>
        <button class="prepend">Tes prepend</button>
    </body>
    <script type="text/javascript">
        $(document).ready(function(){
            $('.after').click(function(){
                $('.kotak').afteer("<h4>contoh after</h4>")
            });
             $('.before').click(function(){
                $('.kotak').afteer("<h4>contoh before</h4>")
            });
            $('.append').click(function(){
                $('.kotak').afteer("<h4>contoh append</h4>")
            });
            $('.prepend').click(function(){
                $('.kotak').afteer("<h4>contoh prepend</h4>")
            });
        });
    </script>
</html>
